<head>
    <style>
        /* The colors are hard-coded and based on the `editor.background` and `editor.foreground` values from `./arduino-ide-extension/src/browser/data/default.color-theme.json` */
        @media (prefers-color-scheme: light) {
            html {
                background: #ffffff;
            }
        }

        /* The colors are hard-coded and based on the `editor.background` and `editor.foreground` values from `./arduino-ide-extension/src/browser/data/dark.color-theme.json` */
        @media (prefers-color-scheme: dark) {
            html {
                background: #1f272a;
            }
        }

        .theia-preload {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            /* Above styles copied from https://github.com/eclipse-theia/theia/blob/5aeef6c0c683b4e91713ab736957e6655b486adc/packages/core/src/browser/style/index.css#L147-L161 */
            /* Otherwise, there is a flickering when Theia's CSS loads. */

            background-image: none;
        }

        .theia-preload::after {
            /* remove default loading animation */
            content: none;
        }

        .spinner-container {
            display: flex;
            flex-direction: center;
            align-self: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .custom-spinner {
            align-self: center;
        }

        .custom-spinner svg {
            width: 16vw;
            height: 16vh;
            animation-delay: 0;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-name: preload-spinner;
            animation-timing-function: ease;
        }

        @keyframes preload-spinner {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.8);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="spinner-container">
        <div class="custom-spinner">
            <svg id="spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
              <defs>
                <linearGradient id="agentBg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="rgb(79, 70, 229)"/>
                  <stop offset="1" stop-color="rgb(49, 46, 129)"/>
                </linearGradient>
              </defs>
              <rect x="48" y="48" width="928" height="928" rx="220" fill="url(#agentBg)"/>
              <polygon points="432,250 592,250 774,790 610,790 512,499 414,790 250,790" fill="#FFFFFF"/>
              <polygon points="470,600 554,600 584,688 440,688" fill="#FFFFFF"/>
              <polygon points="792,192 819.04,268.96 896,296 819.04,323.04 792,400 764.96,323.04 688,296 764.96,268.96" fill="rgb(251, 191, 36)"/>
            </svg>
        </div>
    </div>
</body>
